name: Release

# A v* tag builds every platform and publishes a GitHub release named after the
# tag; a manual run only builds, leaving the installers as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci && npm ci --prefix server && npm ci --prefix web
      - run: npm test --prefix server
      - run: npm test --prefix web

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
          # One native runner per Mac arch: sharp installs only the host's prebuilt binary.
          - os: macos-26
            target: --mac --arm64
          - os: macos-26-intel
            target: --mac --x64
          - os: ubuntu-latest
            target: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci && npm ci --prefix web
      - run: npm run build --prefix web
      - name: Package
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=("-c.extraMetadata.version=${GITHUB_REF_NAME#v}")
          fi
          npx electron-builder ${{ matrix.target }} --publish never "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "$TAG" --generate-notes --verify-tag
          fi
